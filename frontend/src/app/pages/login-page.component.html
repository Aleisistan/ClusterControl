<section class="hero-card">
  <div class="hero-copy">
    

    <h2>Bienvenido</h2>
    <p>
      Iniciá sesión para acceder al panel de administración.
    </p>

    <form class="auth-card" (ngSubmit)="login()">

      <label class="form-label">Usuario</label>
      <input class="form-control" type="text" name="loginUsername" [(ngModel)]="loginForm.username"
        autocomplete="username" minlength="3" maxlength="30" required />

      <label class="form-label mt-3">Contraseña</label>
      <input class="form-control" type="password" name="loginPassword" [(ngModel)]="loginForm.password"
        autocomplete="current-password" minlength="6" maxlength="100" required />

      <div class="validation-hint" *ngIf="shouldShowLoginValidationMessage">{{ loginValidationMessage }}</div>
      <div class="alert alert-danger mt-3" *ngIf="loginError">{{ loginError }}</div>
      <div class="alert alert-success mt-3" *ngIf="sessionMessage">{{ sessionMessage }}</div>

      <button class="btn btn-primary w-100 submit-button" type="submit" [disabled]="isLoggingIn">
        {{ isLoggingIn ? 'Ingresando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</section>

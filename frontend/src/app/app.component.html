<div class="app-shell">
  <header class="navbar navbar-expand-lg custom-bg sticky-top">
    <div class="container-fluid px-4" style="user-select: none;">
      <div class="d-flex align-items-center gap-3 brand-block">
        <img src="logo.png" alt="Logo" height="50" class="logo">
        <div>
          <h1 class="m-0">Cluster Control</h1>
          <small class="text-secondary">Monitoreo de entornos</small>
        </div>
      </div>

      @if (currentUser) {
        <nav class="route-tabs">
          <button type="button" class="route-tab" routerLink="/dashboard"
            [class.active]="isActive('/dashboard')"
            [class.route-tab-current]="isActive('/dashboard')"
            routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            Dashboard
          </button>
          @if (isAdmin) {
            <button type="button" class="route-tab" [class.active]="isActive('/admin/users')" (click)="navigate('/admin/users')">
              Usuarios
            </button>
          }
          @if (isAdmin) {
            <button type="button" class="route-tab" [class.active]="isActive('/admin/clusters')" (click)="navigate('/admin/clusters')">
              Clusters
            </button>
          }
          <div class="session-pill" [class.session-hidden]="sessionHidden">
            <span class="session-status"></span>
            <div>
              <strong>{{ currentUser.username }}</strong>
              <small>Rol: {{ currentUser.role }}</small>
            </div>
            <button class="btn btn-sm btn-outline-light" type="button" (click)="logout()">
              Salir
            </button>
          </div>
        </nav>
      } @else {
        <div class="session-pill guest-pill" [class.session-hidden]="sessionHidden">
          <span class="session-guest">Acceso restringido</span>
          <button class="btn btn-sm btn-primary" type="button" (click)="navigate('/login')">
            Login
          </button>
        </div>
      }

    </div>
  </header>

  <main class="page-main">
    <router-outlet></router-outlet>
  </main>
</div>

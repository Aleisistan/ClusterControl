name: clustercontrol

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ./.env
    command: ["postgres", "-c", "timezone=America/Argentina/Buenos_Aires"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/aleisistan/clustercontrol-backend:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:?Set INITIAL_ADMIN_USERNAME in .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      SEED_DEFAULT_CLUSTERS: "false"
      SEED_DEFAULT_USER: "true"
      INDUSTRIAL_TEST_STATUS_PATH: /tmp/industrial-tests/runner-status.json
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  frontend:
    image: ghcr.io/aleisistan/clustercontrol-frontend:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-/api}
      SOCKET_URL: ${SOCKET_URL:-}
      BACKEND_URL: ${BACKEND_URL:-http://backend:3000}
      NGINX_ENVSUBST_FILTER: BACKEND_URL
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"

volumes:
  postgres_data:
  mosquitto_data:

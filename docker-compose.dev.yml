version: "3.9"

name: clustercontrol

services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./mosquitto/config:/mosquitto/config


  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcuser -d datacenter"]
      interval: 5s
      timeout: 5s
      retries: 10


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "5050:80"


  backend:
    build:
      context: ./backend

    container_name: backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy

      mosquitto:
        condition: service_started

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

    command: npm run start:dev


  simulator:
    build: ./simulator

    container_name: simulator
    restart: unless-stopped

    depends_on:
      mosquitto:
        condition: service_started


  frontend:
    build: ./frontend

    container_name: frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "4200:4200"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_angular:/app/.angular

    stdin_open: true
    tty: true

    environment:
      CHOKIDAR_USEPOLLING: "true"

    command: npm start -- --host 0.0.0.0 --poll 2000


  corx:
    image: ghcr.io/venipa/corx:latest
    container_name: corx
    restart: unless-stopped

    ports:
      - "3001:3001"

    environment:
      PORT: "3001"
      ORIGIN_HOST: "*"
      ALLOWED_RESPONSE_CATEGORIES: "json,xml,html,yml,text"


volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_angular:
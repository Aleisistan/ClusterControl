version: "3.9"

name: clustercontrol

services:

  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto

    ports:
      - "1883:1883"

    volumes:
      - ./mosquitto/config:/mosquitto/config

  postgres:
    image: postgres:16
    container_name: postgres

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcuser -d datacenter"]
      interval: 5s
      timeout: 5s
      retries: 10  

  pgadmin:
    image: dpage/pgadmin4

    container_name: pgadmin

    env_file:
      - .env

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "5050:80"

  backend:
    build: ./backend
    
    container_name: backend

    env_file:
      - ./backend/.env

    
    depends_on:
      postgres:
        condition: service_healthy

      mosquitto:
        condition: service_started  

    ports:
      - "3000:3000"
    volumes:
    - ./backend:/app
    - backend_node_modules:/app/node_modules
    
    command: npm run start:dev  
    
  simulator:
    build: ./simulator

    container_name: simulator

    depends_on:
      - mosquitto

    restart: unless-stopped

  frontend:
    build: ./frontend 

    container_name: frontend

    depends_on:
      - backend

    ports:
      - "4200:4200"
    
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.angular

    stdin_open: true
    tty: true
    environment:
    - CHOKIDAR_USEPOLLING=true
    command: npm start -- --host 0.0.0.0 --poll 2000
  
  corx:
    image: ghcr.io/venipa/corx:latest
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      ORIGIN_HOST: "*"
      ALLOWED_RESPONSE_CATEGORIES: "json,xml,html,yml,text"
    restart: unless-stopped

volumes:
  postgres_data:
  backend_node_modules:
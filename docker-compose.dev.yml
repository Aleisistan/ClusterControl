name: clustercontrol-dev

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ./.env.development.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datacenter}
      POSTGRES_USER: ${POSTGRES_USER:-dcuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-change-me}
    command: ["postgres", "-c", "timezone=America/Argentina/Buenos_Aires"]
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    env_file:
      - ./.env.development.local
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-development-only-change-me}
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ./.env.development.local
    environment:
      NODE_ENV: development
      PORT: "3000"
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingFsWatchFile
      JWT_SECRET: ${DEV_JWT_SECRET:-development-only-change-me}
      JWT_EXPIRES: ${JWT_EXPIRES:-1d}
      INITIAL_ADMIN_USERNAME: ${DEV_INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${DEV_INITIAL_ADMIN_PASSWORD:-admin123}
      MQTT_SERVER: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-dcuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-development-only-change-me}
      DB_NAME: ${POSTGRES_DB:-datacenter}
      SEED_DEFAULT_CLUSTERS: "true"
      SEED_DEFAULT_USER: "true"
      INDUSTRIAL_TEST_STATUS_PATH: /app/industrial-reports/runner-status.json
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - ./tests-industriales/reports:/app/industrial-reports:ro
      - backend_node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run start:dev"

  simulator:
    build:
      context: ./simulator
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
    command: ["node", "simulator.js"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_HOST_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_angular:/app/.angular
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_URL: ${API_URL:-http://localhost:3000}
      SOCKET_URL: ${SOCKET_URL:-}
    command: sh -c "npm ci --no-audit --no-fund && npm start -- --host 0.0.0.0 --poll 2000"

  industrial-tests:
    build:
      context: ./tests-industriales
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      simulator:
        condition: service_started
    env_file:
      - ./.env.development.local
    environment:
      CLUSTERCONTROL_API_URL: http://backend:3000
      CLUSTERCONTROL_MQTT_HOST: mosquitto
      CLUSTERCONTROL_MQTT_PORT: "1883"
      INDUSTRIAL_TEST_USERNAME: ${INDUSTRIAL_TEST_USERNAME:-admin}
      INDUSTRIAL_TEST_PASSWORD: ${INDUSTRIAL_TEST_PASSWORD:-admin123}
    volumes:
      - ./tests-industriales:/workspace
    working_dir: /workspace
    command: ["sleep", "infinity"]

volumes:
  postgres_data:
  mosquitto_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_angular:
